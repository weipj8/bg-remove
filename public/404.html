<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — bg-remove</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080A0C" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/instrument-serif-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Spline Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/spline-sans-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Spline Sans Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/spline-sans-mono-400.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2.5rem 1.25rem;
        background: #080a0c;
        color: #edeff2;
        font-family: "Spline Sans", ui-sans-serif, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      /* The transparency checkerboard, used as the motif rather than an illustration. */
      .board {
        height: 3.5rem;
        border-radius: 10px 10px 0 0;
        background-color: #151b21;
        background-image: linear-gradient(45deg, #1e262e 25%, transparent 25%),
          linear-gradient(-45deg, #1e262e 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1e262e 75%),
          linear-gradient(-45deg, transparent 75%, #1e262e 75%);
        background-size: 14px 14px;
        background-position: 0 0, 0 7px, 7px -7px, -7px 0;
      }
      .panel {
        padding: 1.75rem;
        border: 1px solid #2a343e;
        border-top: 0;
        border-radius: 0 0 10px 10px;
        background: #0e1216;
      }
      .code {
        margin: 0;
        font-family: "Spline Sans Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #c4f135;
      }
      h1 {
        margin: 0.9rem 0 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.9rem, 6vw, 2.6rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.9rem 0 0;
        font-size: 0.9375rem;
        line-height: 1.65;
        color: #8ca0af;
      }
      .path {
        color: #edeff2;
        font-family: "Spline Sans Mono", ui-monospace, monospace;
        font-size: 0.8125rem;
        word-break: break-all;
      }
      a.button {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1rem;
        border-radius: 6px;
        background: #c4f135;
        color: #080a0c;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a.button:hover {
        background: #d3ff5c;
      }
      a.button:focus-visible {
        outline: 2px solid #c4f135;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="board"></div>
      <div class="panel">
        <p class="code">404 · nothing cut</p>
        <h1>That page is not here.</h1>
        <p>
          <span class="path" id="requested"></span> does not exist on this site. bg-remove is one
          page: a background remover that runs entirely in your browser — no upload, no account, no
          watermark.
        </p>
        <a class="button" href="/">Back to the remover</a>
      </div>
    </main>
    <script>
      // Naming the path the visitor asked for is more useful than a generic apology.
      // Written with textContent, never innerHTML, so the URL cannot inject markup.
      document.getElementById("requested").textContent = location.pathname;
    </script>
  </body>
</html>
