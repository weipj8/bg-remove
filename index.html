          {
            "@type": "FAQPage",
            "@id": "https://bg-remove-1cl.pages.dev/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does my photo get uploaded to a server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The image stays in the tab and the model runs on your own GPU or CPU. Once the setup download finishes there is no network request for your photos at all — you can even switch on airplane mode and it keeps working."
                }
              },
              {
                "@type": "Question",
                "name": "Why is the first image slow?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The first run downloads the neural network to your browser — about 25 MiB for MODNet or 42 MiB for RMBG. That happens once per browser, it is stored in the cache, and every visit after that starts processing immediately."
                }
              },
              {
                "@type": "Question",
                "name": "Which model should I pick?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MODNet needs WebGPU, is smaller and is faster, and is the right choice for people. RMBG runs everywhere, is the better all-rounder for products, furniture and text, and is the default. You can switch at any time."
                }
              },
              {
                "@type": "Question",
                "name": "What formats can I use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "JPEG, PNG and WebP up to a few thousand pixels per side. You get a transparent PNG back, and the background editor can flatten it onto a solid colour or an image of your own."
                }
              },
              {
                "@type": "Question",
                "name": "Is it really free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, with no account, no watermark and no usage limit. There is no backend inference to pay for, which is why it can be. The code is open source."
                }
              }
            ]
          }
